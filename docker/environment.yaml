name: CILD
channels:
  - pytorch-nightly
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - glew=2.2.0
  - glib=2.78.4
  - pip=24.0
  - python=3.9
  - pytorch=2.6.0.dev20241112
  - pytorch-cuda=12.4
  - torchvision=0.15.2
  - pip:
    # Core RL / config / logging
    - hydra-core==1.3.2
    - hydra-submitit-launcher==1.2.0
    - submitit==1.5.1
    - omegaconf==2.3.0
    - tensordict-nightly==2025.1.1
    - torchrl-nightly==2025.1.1
    - kornia==0.7.2
    - termcolor==2.4.0
    - tqdm==4.66.4
    - pandas==2.0.3
    - wandb==0.17.4
    - h5py==3.11.0
    # Media
    - imageio==2.34.1
    - imageio-ffmpeg==0.4.9
    - moviepy==1.0.3
    - ffmpeg==1.4
    - glfw==2.7.0
    # Benchmark: Safety Gymnasium for navigation/avoidance.
    # NOTE: safety-gymnasium 1.0.0 pins mujoco<3 and gymnasium<0.29, which
    # is incompatible with dm-control 1.0.16. The CILD path doesn't need
    # dm_control (locomotion is out of scope), so we accept the older pins.
    - safety-gymnasium==1.0.0
    # safety-gymnasium 1.0 transitively requires:
    #   mujoco==2.3.3, gymnasium==0.28.1, numpy==1.23.5,
    #   gymnasium-robotics==1.2.2, pettingzoo==1.24.3, pygame==2.1.0
